[workspace]
resolver = "2"
members = ["arnes-core", "arnes-blue", "arnes-anthropic", "arnes-mcp-client", "arnes-loop", "arnes-tui", "arnes-config", "arnes-tools", "arnes-store", "arnes-vigy", "arnes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/arnes"
authors = ["pleme-io"]

[workspace.dependencies]
arnes-core = { path = "arnes-core" }
arnes-anthropic = { path = "arnes-anthropic" }
arnes-mcp-client = { path = "arnes-mcp-client" }
arnes-loop = { path = "arnes-loop" }
arnes-tools = { path = "arnes-tools" }
arnes-tui = { path = "arnes-tui" }
arnes-config = { path = "arnes-config" }
arnes-blue = { path = "arnes-blue" }
arnes-store = { path = "arnes-store" }
arnes-vigy = { path = "arnes-vigy" }
# vigy: the one reconciler runtime every host embeds (theory/VIGY.md).
vigy-runtime = { git = "https://github.com/pleme-io/vigy" }
vigy-eval = { git = "https://github.com/pleme-io/vigy" }
vigy-types = { git = "https://github.com/pleme-io/vigy" }
vigy-store = { git = "https://github.com/pleme-io/vigy" }
arnes = { path = "arnes" }
# tatara-lisp is the canonical published Lisp crate. The macros come
# re-exported from the lib as DeriveTataraDomain / DeriveKeywordSexp, so a
# consumer never names tatara-lisp-derive itself.
tatara-lisp = { version = "0.4" }
tatara-lisp-eval = "0.4"
# blue: arnes is programmed in blue. The runtime's `hosted` seam (load a
# program into an interpreter over arnes's host type, call a definition) is
# the one embedding; blue-lang-pkg resolves `use("pkg")` from BLUE_PATH.
blue-lang-runtime = { git = "https://github.com/pleme-io/blue" }
blue-lang-host = { git = "https://github.com/pleme-io/blue" }
blue-lang-pkg = { git = "https://github.com/pleme-io/blue", features = ["embedded"] }
# shikumi via git: Format::Nix landed post-0.1.0 and arnes-config uses it.
# Bare URL (no branch=) so it matches moldura's reference and Cargo dedups
# the lockfile to a single shikumi source — otherwise rustc errors with
# colliding StableCrateId across the two source URLs.
shikumi = { version = "0.1", features = ["lisp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
anyhow = { version = "1" }
thiserror = { version = "2" }
clap = { version = "4", features = ["derive", "env"] }
schemars = { version = "0.8", features = ["chrono"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs", "process", "time"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The global allocator. Direct, not through moldura's mimalloc_init!:
# moldura is a private repository, so the nix sandbox cannot fetch it,
# and that one macro was arnes's only use of it.
mimalloc = { version = "0.1.52", default-features = false }
# The fleet TUI stack, from crates.io. egaku-term 0.3.8 carries the
# `hotkey_map` / `on_text` / `event::testing` surface these crates target,
# and `awase` is the typed key vocabulary egaku-term delivers into.
egaku-term = { version = "0.3.20", features = ["markdown"] }  # 0.3.20: markdown (mojiban rows -> styles);0.3.18: draw::picker_with; 0.3.19: Palette::from_fleet, ColorDepth, anim
# The fleet design tokens: FleetTheme (what `tema` names).
ishou-tokens = "0.1.18"
# 0.1.16 readline; 0.1.17 row access; 0.1.18 vt (OSC); 0.1.19 chigai::unified;
# 0.1.22 nav (Navigator, the shared navigation grammar) + vt::osc52_copy.
egaku = "0.1.22"
awase = "0.1"
unicode-segmentation = "1.12"
# MCP client — rmcp's child-process transport, the line kaname + mado pin.
rmcp = { version = "0.15", features = ["client", "transport-child-process"] }
# The fleet fuzzy scorer (egaku's picker uses it too) — ranks deferred MCP tools.
shibori = "0.1.1"
# The fleet's history ranking (wadachi_spec::usage): the Ctrl-R feed, ranked the
# way skim-tab ranks the shell's.
wadachi-spec = "0.1.11"
# Markdown + code highlighting for replies (fenced blocks split per line, 0.1.3).
mojiban = "0.1.6"  # 0.1.6: render_markdown, the block-structured document engine
# gitignore-aware walking for @ mentions (ripgrep's walker).
ignore = "0.4"
globset = "0.4"
# The fleet's SKILL.md frontmatter parser (docs/profiles.md §3).
skill-lint = "0.1.5"
regex = "1"
# The fleet's canonical cost-event shape (attribution-forge et al. read it).
pleme-io-forge-core = "0.1.3"
# Credentials as a type: redacted Debug, no Display, scrubbed on drop.
cofre-secret = "0.1.27"
handan = "0.1.2"
# The fleet's command guard — the same production rule set the Claude Code
# hook enforces (guardrail::production). Public; not on crates.io.
guardrail = { git = "https://github.com/pleme-io/guardrail" }
# Vim: escriba's shared vocabulary, modal state and single-line resolver —
# the one vim implementation the fleet shares (docs/tui-parity.md §4.8.1).
escriba-core = "0.1.85"
escriba-mode = "0.1.85"
unsoku = "0.1.85"
# The shared vim key layer (extracted from escriba-runtime) + ex verbs.
escriba-keymap = "0.1.85"
escriba-command = "0.1.85"
crossterm = { version = "0.28", features = ["event-stream"] }
async-trait = { version = "0.1" }
futures = { version = "0.3" }
chrono = { version = "0.4", features = ["serde"] }
pretty_assertions = { version = "1" }
tempfile = { version = "3" }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true




