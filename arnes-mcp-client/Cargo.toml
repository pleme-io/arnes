[package]
name         = "arnes-mcp-client"
description  = "MCP client — spawns stdio MCP servers (from anvil or ad-hoc), forwards tools/call, returns results into the arnes loop."
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true
authors      .workspace = true

[dependencies]
arnes-core = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
async-trait = { workspace = true }
rmcp       = { workspace = true }
futures    = { workspace = true }
shibori    = { workspace = true }
globset    = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true

# The test binary is its own MCP fixture: started with ARNES_MCP_FIXTURE set,
# it serves one tool over stdio instead of running the tests.
[[test]]
name = "reconcile"
harness = false
